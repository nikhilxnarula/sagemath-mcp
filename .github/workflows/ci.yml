name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    # Registry resolution needs no Sage, so it is cheap to guard on every push.
    name: registry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not sage" -q

  sage:
    # Sage is native in this container, so the WSL discovery branch is not
    # exercised here; it is covered by running the suite on Windows locally.
    name: full tests with SageMath
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: sage -python -m pip install -e ".[test]"
      - run: sage -python -m pytest -q
